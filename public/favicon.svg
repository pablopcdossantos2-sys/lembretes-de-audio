<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Material Blue Shades) -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1976D2" />
      <stop offset="50%" stop-color="#1565C0" />
      <stop offset="100%" stop-color="#0D47A1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Adaptive Icon Background: Material squircle -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)" />

  <!-- Adaptive Icon Foreground: Stylized Clock and Dynamic Sound Waves -->
  <g filter="url(#shadow)" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <!-- Clock Outer Ring -->
    <circle cx="86" cy="96" r="44" stroke="#E3F2FD" stroke-width="10" />
    
    <!-- Clock Hands (Indicating recurring time interval) -->
    <polyline points="86,66 86,96 104,106" stroke="#90CAF9" stroke-width="8" />

    <!-- Center Pivot Pin -->
    <circle cx="86" cy="96" r="4" fill="#FFFFFF" stroke="none" />

    <!-- Acoustic Sound Waves in Shades of Blue / White -->
    <!-- Wave 1 -->
    <path d="M 136 76 A 28 28 0 0 1 136 116" stroke="#BBDEFB" stroke-width="9" />
    
    <!-- Wave 2 -->
    <path d="M 150 62 A 46 46 0 0 1 150 130" stroke="#64B5F6" stroke-width="8" />

    <!-- Wave 3 -->
    <path d="M 164 48 A 64 64 0 0 1 164 144" stroke="#2196F3" stroke-width="7" opacity="0.9" />
  </g>
</svg>
